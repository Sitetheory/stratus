<div
        [attr.id]="elementId"
        [formGroup]="form"
>
    <mat-progress-bar *ngIf="collection.pending" mode="indeterminate"></mat-progress-bar>
    <ng-container *ngIf="displayMode !== 'cards'">
    <sa-stripe-setup-intent
            *ngIf="collection.completed && !collection.pending && collection.models.length === 0"
            data-detailed-billing-info="true"
            [defaultBillingInfo]="defaultBillingInfo"
            [urlRoot]="urlRoot"
            [paymentMethodApiPath]="paymentMethodApiPath"
            [addCardButtonText]="addCardButtonText"
    ></sa-stripe-setup-intent>
    <mat-form-field
            [hidden]="!collection.completed || collection.pending || collection.models.length === 0"
            style="width: 100%;" [class.payment-selected]="form.controls[fieldName].value"
    >
        <mat-label [textContent]="form.controls[fieldName].value ? 'Payment Method' : selectCardButtonText"></mat-label>
        <mat-select
                #paymentSelect
                [panelClass]="'sa-stripe-payment-method-selector-select-override'"
                formControlName="{{fieldName}}"
                [compareWith]="objectComparisonFunction"
        >
            <mat-select-trigger>
                <sa-stripe-payment-method-item *ngIf="form.controls[fieldName].value" [(model)]="form.controls[fieldName].value" [templateStyle]="selectedTemplateStyle"></sa-stripe-payment-method-item>
                <!--{{form.controls.dataNumber.value && form.controls.dataNumber.value.data ? form.controls.dataNumber.value.data.id : 'Not Selected'}}-->
            </mat-select-trigger>
            <mat-option
                    class="no-results"
                    *ngIf="collection.completed && !collection.pending && collection.models.length === 0"
                    [disabled]="true"
            >
                No Payment Method on file.
            </mat-option>
            <mat-option
                    class="current-selection"
                    *ngIf="form.controls[fieldName].value"
                    [disabled]="true"
            >
                Current Method
                <sa-stripe-payment-method-item [(model)]="form.controls[fieldName].value"></sa-stripe-payment-method-item>
            </mat-option>
            <mat-option
                    *ngFor="let paymentMethod of collection.models"
                    [value]="paymentMethod"
                    [disabled]="isPMExpired(paymentMethod)"
            >
                <sa-stripe-payment-method-item [(model)]="paymentMethod" [editable]="true"></sa-stripe-payment-method-item>
            </mat-option>
            <mat-option
                    class="remove-selection"
                    *ngIf="form.controls[fieldName].value"
            >
                <button mat-raised-button>Deselect Payment Method</button>
            </mat-option>
            <mat-option
                    [hidden]="!collection.completed || collection.pending"
                    [disabled]="true"
            >
                <sa-stripe-setup-intent
                        data-detailed-billing-info="true"
                        [defaultBillingInfo]="defaultBillingInfo"
                        [urlRoot]="urlRoot"
                        [paymentMethodApiPath]="paymentMethodApiPath"
                        [addCardButtonText]="addCardButtonText"
                ></sa-stripe-setup-intent>
            </mat-option>
        </mat-select>
        <input formControlName="{{fieldNameId}}" [attr.id]="elementId+'_'+fieldNameId" type="text" style="display: none;">
    </mat-form-field>
    </ng-container>
    <ng-container *ngIf="displayMode === 'cards'">
        <div class="payment-method-cards" *ngIf="collection.completed && !collection.pending">
            <div
                    class="payment-method-card"
                    *ngFor="let paymentMethod of cardModels()"
                    [class.current]="isCurrent(paymentMethod)"
                    [class.expired]="isPMExpired(paymentMethod)"
            >
                <sa-stripe-payment-method-item #paymentMethodItem [(model)]="paymentMethod"></sa-stripe-payment-method-item>
                <div class="payment-method-card-actions">
                    <span class="payment-method-card-primary">
                        <span class="current-method" *ngIf="isCurrent(paymentMethod)">&#10003; <span [textContent]="currentMethodText"></span></span>
                        <button
                                *ngIf="!isCurrent(paymentMethod) && !isPMExpired(paymentMethod)"
                                type="button"
                                class="select-button"
                                [disabled]="disabled && disabled !== 'false'"
                                (click)="selectPaymentMethod(paymentMethod, $event)"
                                [textContent]="selectButtonText"
                        ></button>
                    </span>
                    <span class="payment-method-card-secondary">
                        <button
                                *ngIf="isCurrent(paymentMethod)"
                                type="button"
                                class="text-button deselect-button"
                                [disabled]="disabled && disabled !== 'false'"
                                (click)="selectPaymentMethod(null, $event)"
                                [textContent]="deselectButtonText"
                        ></button>
                        <button
                                type="button"
                                class="text-button delete-button"
                                [disabled]="!paymentMethod.completed || paymentMethod.pending"
                                (click)="paymentMethodItem.deletePM($event)"
                                [textContent]="deleteButtonText"
                        ></button>
                    </span>
                </div>
            </div>
            <div class="payment-method-card add-payment-method">
                <sa-stripe-setup-intent
                        data-detailed-billing-info="true"
                        [defaultBillingInfo]="defaultBillingInfo"
                        [urlRoot]="urlRoot"
                        [paymentMethodApiPath]="paymentMethodApiPath"
                        [addCardButtonText]="addCardButtonText"
                ></sa-stripe-setup-intent>
            </div>
        </div>
        <input formControlName="{{fieldNameId}}" [attr.id]="elementId+'_'+fieldNameId" type="text" style="display: none;">
    </ng-container>
</div>
