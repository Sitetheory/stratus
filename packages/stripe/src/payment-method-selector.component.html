<div
        [attr.id]="elementId"
        [formGroup]="form"
>
    <mat-progress-bar *ngIf="collection.pending" mode="indeterminate"></mat-progress-bar>
    <ng-container *ngIf="displayMode !== 'cards'">
    <sa-stripe-setup-intent
            *ngIf="collection.completed && !collection.pending && collection.models.length === 0"
            data-detailed-billing-info="true"
            [defaultBillingInfo]="defaultBillingInfo"
            [urlRoot]="urlRoot"
            [paymentMethodApiPath]="paymentMethodApiPath"
            [addCardButtonText]="addCardButtonText"
    ></sa-stripe-setup-intent>
    <mat-form-field appearance="outline" [hidden]="!collection.completed || collection.pending || collection.models.length === 0">
        <mat-label [textContent]="form.controls[fieldName].value ? 'Payment Method' : selectCardButtonText"></mat-label>
        <mat-select
                #paymentSelect
                disableOptionCentering
                [panelClass]="'sa-stripe-payment-method-selector-select-override'"
                formControlName="{{fieldName}}"
                [compareWith]="objectComparisonFunction"
        >
            <mat-select-trigger>
                <sa-stripe-payment-method-item *ngIf="form.controls[fieldName].value" [(model)]="form.controls[fieldName].value" templateStyle="compact"></sa-stripe-payment-method-item>
            </mat-select-trigger>
            <mat-option
                    class="no-results"
                    *ngIf="collection.completed && !collection.pending && collection.models.length === 0"
                    [disabled]="true"
            >
                No Payment Method on file.
            </mat-option>
            <mat-option
                    *ngFor="let paymentMethod of cardModels()"
                    [value]="paymentMethod"
                    [disabled]="isPMExpired(paymentMethod)"
            >
                <span class="option-radio" [class.checked]="isCurrent(paymentMethod)"></span>
                <sa-stripe-payment-method-item [(model)]="paymentMethod" [editable]="true" [current]="isCurrent(paymentMethod)" templateStyle="compact"></sa-stripe-payment-method-item>
            </mat-option>

        </mat-select>
        <input formControlName="{{fieldNameId}}" [attr.id]="elementId+'_'+fieldNameId" type="text" style="display: none;">
    </mat-form-field>
        <div class="payment-selector-actions" *ngIf="collection.completed && !collection.pending && collection.models.length > 0">
                <button type="button" class="deselect-button" *ngIf="form.controls[fieldName].value"
                        (click)="deselectPaymentMethod()">Deselect Payment Method</button>
                <sa-stripe-setup-intent
                        data-detailed-billing-info="true"
                        [defaultBillingInfo]="defaultBillingInfo"
                        [urlRoot]="urlRoot"
                        [paymentMethodApiPath]="paymentMethodApiPath"
                        [addCardButtonText]="addCardButtonText"
                ></sa-stripe-setup-intent>
        </div>
    </ng-container>
    <ng-container *ngIf="displayMode === 'cards'">
        <div class="payment-method-cards" *ngIf="collection.completed && !collection.pending">
            <div
                    class="payment-method-card"
                    *ngFor="let paymentMethod of cardModels()"
                    [class.current]="isCurrent(paymentMethod)"
                    [class.expired]="isPMExpired(paymentMethod)"
            >
                <sa-stripe-payment-method-item #paymentMethodItem [(model)]="paymentMethod"></sa-stripe-payment-method-item>
                <!-- Setting the form control saves the same way as choosing a dropdown option -->
                <div class="payment-method-card-actions">
                    <span>
                        <span class="current-method" *ngIf="isCurrent(paymentMethod)">&#10003; Current Method</span>
                        <button type="button" class="select-button" *ngIf="!isCurrent(paymentMethod) && !isPMExpired(paymentMethod)"
                                [disabled]="form.controls[fieldName].disabled"
                                (click)="form.controls[fieldName].setValue(paymentMethod)">Select</button>
                    </span>
                    <span class="payment-method-card-secondary">
                        <button type="button" class="text-button" *ngIf="isCurrent(paymentMethod)"
                                [disabled]="form.controls[fieldName].disabled"
                                (click)="deselectPaymentMethod()">Deselect</button>
                        <button type="button" class="text-button"
                                [disabled]="!paymentMethod.completed || paymentMethod.pending"
                                (click)="paymentMethodItem.deletePM($event)">Delete</button>
                    </span>
                </div>
            </div>
            <div class="payment-method-card add-payment-method">
                <sa-stripe-setup-intent
                        data-detailed-billing-info="true"
                        [defaultBillingInfo]="defaultBillingInfo"
                        [urlRoot]="urlRoot"
                        [paymentMethodApiPath]="paymentMethodApiPath"
                        [addCardButtonText]="addCardButtonText"
                ></sa-stripe-setup-intent>
            </div>
        </div>
        <input formControlName="{{fieldNameId}}" [attr.id]="elementId+'_'+fieldNameId" type="text" style="display: none;">
    </ng-container>
</div>
